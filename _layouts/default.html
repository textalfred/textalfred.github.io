<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}">
  {%- include head.html -%}
  <body a="{{ site.theme_config.appearance | default: "auto" }}">
    <main class="page-content" aria-label="Content">
      <div class="w">


        {{ content }}

        <footer>
          <img class="art art-bottom" src="{{ "/assets/bat-holo.png" | relative_url }}" alt="Bat-signal" width="170" height="113" loading="lazy">
          <p><sub>{{ site.data.alfred.footer.disclaimer }}</sub></p>
        </footer>
      </div>
    </main>

    <a class="sticky-cta" href="{{ '/#waitlist' | relative_url }}" hidden>{%- include bat.html -%}{{ site.data.alfred.hero.cta }}{%- include bat.html -%}</a>
    <script src="{{ "/assets/js/sticky.js" | relative_url }}" defer></script>
  </body>
</html>
