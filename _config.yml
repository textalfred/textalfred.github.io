title: Alfred # name of the site
author: Alfred # placeholder
url: "https://textalfred.github.io" # production host
baseurl: "" # served from the root of textalfred.github.io
description: Your AI butler, on WhatsApp. # overwritten in <head> by site.data.alfred.meta

permalink: /:slug.html

collections:
  handles:
    output: true
    permalink: /handles/:name.html

defaults:
  - scope: { path: "", type: handles }
    values: { layout: page }

favicon: "favicon.png" # name+extension of favicon (must be in the root folder)
# goat_counter: "yoursitename" # put your GoatCounter name if you want to use GoatCounter analytics

formspree_id: xvkgqwak # Formspree waitlist form

theme_config:
  appearance: "dark" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: true # show blog description in home page

sass:
  style: :compressed

plugins:
  - jekyll-seo-tag

exclude:
  - art/
  - TESTPLAN.md
  - REVIEW.md
  - LICENSE.txt
  - README.md
  - Gemfile
  - Gemfile.lock
  - no-style-please.gemspec
  - vendor/
