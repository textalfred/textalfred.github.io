handles_index:
  title: "What Alfred handles."
  intro: "Eight things he'll take off your hands, all from one WhatsApp chat. Pick one; he'll explain himself."
  description: "Everything Alfred handles on WhatsApp: groceries, the cook, your spending, calendar, reminders, rides, reels and long documents."

subpage_cta:
  line: "Your room is being made up. Do put your name down."
  cta: "Join the waitlist"

final:
  title: "The Bat-signal is optional."
  subtitle: "The waitlist isn't."
  label: "final call"
  cta: "Join the waitlist"
  fields:
    name: { label: "Your name", placeholder: "Bruce" }
    phone: { label: "WhatsApp number", placeholder: "+91 98xxx xxxxx" }
    task: { label: "The most boring thing you'd hand off first", placeholder: "e.g. ordering groceries", optional: "(optional)" }
  note: "We'll message you on WhatsApp when your room is ready. That's the only message you'll get from us until then."
  success: "Very good. You're on the list, and I'll message you on WhatsApp the moment your room is ready."
  error: "Something went amiss on our end. Do try again in a moment."

