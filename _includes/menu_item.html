<ul>
  {%-for item in include.collection-%}
    <li>
    {%- if item.url -%}
      <a href="{% if item.url contains '://' %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}">{{ item.title }}</a>
    {%- else -%}
      <b>{{ item.title }}</b>
    {%- endif -%}
    {%-if item.entries-%}
      {%-include menu_item.html collection=item.entries-%}
    {%-endif-%}
    </li>
  {%-endfor-%}
</ul>
